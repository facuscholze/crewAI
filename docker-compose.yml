version: '3.8'

services:
  # Servidor principal de Integrado
  integrado:
    build: .
    container_name: integrado-server
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_ACCESS_TOKEN=${FACEBOOK_ACCESS_TOKEN}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/integrado
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
    volumes:
      - ./logs:/app/logs
      - ./temp_audio:/app/temp_audio
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - integrado-network

  # Redis para cache de contexto
  redis:
    image: redis:7-alpine
    container_name: integrado-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - integrado-network

  # PostgreSQL para almacenamiento persistente
  postgres:
    image: postgres:15-alpine
    container_name: integrado-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=integrado
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    restart: unless-stopped
    networks:
      - integrado-network

  # Nginx para load balancing (opcional)
  nginx:
    image: nginx:alpine
    container_name: integrado-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - integrado
    restart: unless-stopped
    networks:
      - integrado-network

volumes:
  redis-data:
  postgres-data:

networks:
  integrado-network:
    driver: bridge






